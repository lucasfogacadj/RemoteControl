<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windows Activity Control</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Control Hub</p>
          <h1>Windows Activity Control</h1>
        </div>
        <button id="toggleButton" class="toggle-button" type="button">Carregando</button>
      </header>

      <section class="status-grid" aria-label="Estado atual">
        <article class="panel">
          <div class="panel-header">
            <h2>Agente</h2>
            <span id="agentBadge" class="badge">Offline</span>
          </div>
          <dl class="metrics">
            <div>
              <dt>ID</dt>
              <dd id="agentId">-</dd>
            </div>
            <div>
              <dt>Heartbeat</dt>
              <dd id="agentHeartbeat">-</dd>
            </div>
            <div>
              <dt>Mensagem</dt>
              <dd id="agentMessage">-</dd>
            </div>
          </dl>
        </article>

        <article class="panel">
          <div class="panel-header">
            <h2>Execucao</h2>
            <span id="enabledBadge" class="badge">Pausada</span>
          </div>
          <dl class="metrics">
            <div>
              <dt>Intervalo</dt>
              <dd id="intervalSummary">-</dd>
            </div>
            <div>
              <dt>Arquivo</dt>
              <dd id="targetSummary">-</dd>
            </div>
            <div>
              <dt>Digitacao</dt>
              <dd id="typingSummary">-</dd>
            </div>
            <div>
              <dt>Mouse</dt>
              <dd id="mouseSummary">-</dd>
            </div>
            <div>
              <dt>Ritmo</dt>
              <dd id="rhythmSummary">-</dd>
            </div>
            <div>
              <dt>Cenario</dt>
              <dd id="scenarioSummary">-</dd>
            </div>
            <div>
              <dt>Comandos</dt>
              <dd id="commandSummary">-</dd>
            </div>
          </dl>
        </article>
      </section>

      <section class="workspace">
        <form id="settingsForm" class="panel form-panel">
          <div class="panel-header">
            <h2>Rotinas</h2>
            <button class="primary" type="submit">Salvar</button>
          </div>

          <div class="form-grid">
            <label>
              Arquivo VS Code
              <input id="vscodeTargetFile" name="vscodeTargetFile" type="text" placeholder="C:\caminho\arquivo.txt" />
            </label>
            <label>
              Codigo por execucao
              <input id="vscodeTextLength" name="vscodeTextLength" type="number" min="1" max="500" />
            </label>
            <label>
              Intervalo entre teclas (s)
              <input id="vscodeTypingInterval" name="vscodeTypingInterval" type="number" min="0" max="2" step="0.01" />
            </label>
            <label>
              Linguagem do codigo
              <select id="codeLanguage" name="codeLanguage">
                <option value="random">Aleatoria</option>
                <option value="go">Go</option>
                <option value="python">Python</option>
                <option value="js">JavaScript</option>
                <option value="typescript">TypeScript</option>
                <option value="rust">Rust</option>
                <option value="java">Java</option>
              </select>
            </label>
            <label>
              Taxa de erro
              <input id="typoRate" name="typoRate" type="number" min="0" max="0.1" step="0.01" />
            </label>
            <label>
              Chance pausa pensamento
              <input id="thinkingPauseChance" name="thinkingPauseChance" type="number" min="0" max="0.2" step="0.01" />
            </label>
            <label>
              Botao do mouse
              <select id="mouseClickButton" name="mouseClickButton">
                <option value="left">Esquerdo</option>
                <option value="right">Direito</option>
                <option value="middle">Meio</option>
              </select>
            </label>
            <label>
              Clicks por execucao
              <input id="mouseClickCount" name="mouseClickCount" type="number" min="1" max="10" />
            </label>
            <label>
              Margem do click aleatorio (px)
              <input id="mouseClickMargin" name="mouseClickMargin" type="number" min="1" max="1000" />
            </label>
            <label>
              Duracao movimento mouse (s)
              <input id="mouseMoveDuration" name="mouseMoveDuration" type="number" min="0.5" max="3" step="0.1" />
            </label>
            <label>
              Chance overshoot mouse
              <input id="mouseOvershootChance" name="mouseOvershootChance" type="number" min="0" max="0.3" step="0.01" />
            </label>
            <label>
              Intervalo minimo (s)
              <input id="minInterval" name="minInterval" type="number" min="5" />
            </label>
            <label>
              Intervalo maximo (s)
              <input id="maxInterval" name="maxInterval" type="number" min="5" />
            </label>
            <label>
              Perfil
              <select id="profile" name="profile">
                <option value="developer_remote">Dev remoto</option>
                <option value="developer_clt">CLT 9-18</option>
                <option value="freelancer">Freelancer</option>
              </select>
            </label>
            <label>
              Almoco inicio
              <input id="lunchStart" name="lunchStart" type="time" />
            </label>
            <label>
              Almoco fim
              <input id="lunchEnd" name="lunchEnd" type="time" />
            </label>
            <label>
              Jitter almoco (min)
              <input id="lunchJitter" name="lunchJitter" type="number" min="0" max="120" />
            </label>
            <label>
              Coffee breaks
              <input id="coffeeBreakCount" name="coffeeBreakCount" type="number" min="0" max="4" />
            </label>
            <label>
              Jitter inicio (min)
              <input id="workStartJitter" name="workStartJitter" type="number" min="0" max="180" />
            </label>
            <label>
              Cenario
              <select id="scenarioType" name="scenarioType">
                <option value="random">Aleatorio</option>
                <option value="coding_session">Coding session</option>
                <option value="email_check">Email check</option>
                <option value="discord_chat">Discord chat</option>
              </select>
            </label>
          </div>

          <div class="routine-list" id="routineList"></div>
          <p id="formMessage" class="form-message" role="status"></p>
        </form>

        <aside class="panel">
          <div class="panel-header">
            <h2>Eventos</h2>
            <button id="refreshButton" class="secondary" type="button">Atualizar</button>
          </div>
          <ol id="eventList" class="event-list"></ol>
        </aside>
      </section>
    </main>

    <script src="/static/app.js?v=476734e"></script>
  </body>
</html>
